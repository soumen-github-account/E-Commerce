  <head>
    <meta charset="UTF-8" />

    <!-- Website Title -->
    <title>
      Shopstic - Buy Fashion, Electronics & Accessories Online
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Shopstic is an online ecommerce platform for fashion, electronics, accessories, and more with fast delivery and affordable prices."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="ecommerce, online shopping, fashion, electronics, accessories, India shopping"
    />

    <!-- Author -->
    <meta name="author" content="Shopstic" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph SEO -->
    <meta property="og:title" content="Shopstic Ecommerce" />
    
    <meta
      property="og:description"
      content="Buy fashion, electronics, and accessories online at Shopstic."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:image"
      content="https://your-domain.com/logo.png"
    />

    <meta
      property="og:url"
      content="https://e-commerce-frontend-10m4.onrender.com"
    />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      body {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
